# Builds on Linux (the self-hosted VPS runner, inside ci/run-ci) and macOS (Homebrew), runs the
# network-free unit tests, and rehearses the Debian release with vl-release. The live FortiGate suite
# is compiled but never run here (AGENTS.md).
#
# Every Linux run step executes in the disposable CI container (ci/run-ci, rootless Podman,
# ci/Containerfile): no host sudo, host packages or Docker. Pull requests from forks run on
# GitHub-hosted runners, never on the self-hosted one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VL_RELEASE_TAG: v0.5.1
  # Stock image for clean-install smoke tests (same digest as ci/Containerfile's base).
  UBUNTU_IMAGE: docker.io/library/ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55

jobs:
  linux:
    name: Build (Ubuntu 24.04)
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","ubuntu-latest-lts"]') }}
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # One build per job: the network-free unit suite at -O0 without debug info, under AddressSanitizer
      # and UndefinedBehaviorSanitizer, on every core memory allows (ci/build-jobs). The live suite is
      # never built here (exhaustive.yml builds it on demand); the release workflow tests an -O3 build.
      # The tests run what was built: the check fails if anything would still compile.
      - name: Build (warnings are errors, ASan/UBSan) and run the unit tests
        run: |
          meson setup build/ci -Dtests=enabled -Dlive_tests=false -Dwerror=true -Db_sanitize=address,undefined \
            -Db_lundef=false --buildtype=debug -Ddebug=false
          meson compile -C build/ci -j "$(ci/build-jobs)"
          test "$(ninja -C build/ci -n | tail -n 1)" = "ninja: no work to do."
          meson test -C build/ci --no-rebuild --suite unit --print-errorlogs

      - name: Generated headers are up to date
        run: python3 tools/fortios/fortios.py check

      # The hand-written headers; the generated ones are covered by the check above and the build.
      - name: Public headers compile standalone
        run: ci/check-headers.sh

  package:
    name: Release contract and Debian rehearsal
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","Linux","X64","ubuntu-latest-lts"]') }}
    permissions:
      contents: read
      id-token: write   # docs dry-run sync over GitHub OIDC
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Repository contract
        id: state
        run: |
          vlr check
          vlr install-skill --check
          vlr status --github-output

      # Published by release.yml (docs set slug: forti-api). Pushes to main also send a dry-run sync
      # over GitHub OIDC (endpoint, slug and trust, no writes); the docs set does not accept OIDC
      # tokens from pull_request events, so PRs validate only.
      - name: Docs package
        env:
          VL_DOCS_ENDPOINT: ${{ vars.VL_DOCS_ENDPOINT }}
        run: |
          pmdocs validate --source forti-api
          if [ "${{ github.event_name }}" = push ] && [ -n "$VL_DOCS_ENDPOINT" ]; then
            pmdocs push --endpoint "$VL_DOCS_ENDPOINT" --source forti-api --github-oidc --dry-run
          fi

      # A full local release in this ephemeral checkout; nothing is published.
      # Between releases (staged docs, version not bumped yet) the rehearsal bumps the version in this
      # ephemeral checkout only, so every PR still builds and validates the package.
      - name: Release rehearsal
        if: contains(fromJSON('["pending","prepared","unbumped"]'), steps.state.outputs.phase)
        run: |
          if [ "${{ steps.state.outputs.phase }}" = unbumped ]; then vlr version bump minor; fi
          vlr prepare
          vlr build-deb
          vlr source-archive
          vlr homebrew formula
          vlr checksums
          vlr validate-artifacts

      # Install the built .deb into a clean, stock Ubuntu 24.04 (container root, no host access) and
      # build a consumer against it.
      - name: Clean-install smoke test of the built package
        if: contains(fromJSON('["pending","prepared","unbumped"]'), steps.state.outputs.phase)
        shell: bash
        run: |
          # shellcheck disable=SC2016  # expanded inside the container
          ./ci/run-ci --image "$UBUNTU_IMAGE" --root bash -euo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends ./release/libforti-api-dev_*_all.deb g++ pkgconf
            test ! -e /usr/include/nlohmann
            g++ -std=c++23 -Wall -Wextra -Werror ci/consumer.cpp $(pkg-config --cflags --libs forti-api) -o /tmp/consumer
            /tmp/consumer
          '

  # The oldest macOS (and Xcode) consumers build on: the headers must compile with its libc++ (G16:
  # floating-point from_chars arrived only in Xcode 26). forti-cli and forti-mcp test the newest.
  macos:
    name: Build and tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Homebrew packages
        run: brew install meson ninja googletest

      # One build: the unit suite at -O0 without debug info (Apple clang), tested and installed as built.
      - name: Build, test and install
        run: |
          meson setup build -Dtests=enabled -Dlive_tests=false -Dwerror=true --buildtype=debug -Ddebug=false \
            --prefix "$RUNNER_TEMP/prefix"
          meson compile -C build -j "$(ci/build-jobs)"
          test "$(ninja -C build -n | tail -n 1)" = "ninja: no work to do."
          meson test -C build --no-rebuild --suite unit --print-errorlogs
          meson install -C build --no-rebuild

      - name: Build a consumer against the installed headers
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/prefix/share/pkgconfig"
          # shellcheck disable=SC2046  # pkg-config output is a list of flags
          c++ -std=c++23 -Wall -Wextra -Werror ci/consumer.cpp $(pkg-config --cflags --libs forti-api) -o consumer
          ./consumer

  # The formula's own build (headers and the example, no tests), in its own job: one build per job.
  homebrew:
    name: Homebrew formula (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Homebrew packages
        run: brew install meson ninja

      # vl-release from its pinned release tag (pure Python, no install needed).
      - name: vl-release
        run: |
          git clone --quiet --depth 1 --branch "$VL_RELEASE_TAG" https://github.com/valkyrianlabs/vl-release.git "$RUNNER_TEMP/vl-release"
          echo "$RUNNER_TEMP/vl-release/bin" >> "$GITHUB_PATH"

      # Installs the formula from a throwaway local tap and runs its test block (ephemeral checkout:
      # the script prepares the release documents).
      - name: Homebrew formula
        run: bash .github/scripts/homebrew-local-install.sh
